# Gradle配置
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# 使用本地Java 17（Forge 1.20.1必须使用Java 17构建）
org.gradle.java.home=I:/我的世界/java环境/Java1

# 网络超时配置（适配国内网络）
org.gradle.internal.http.connectionTimeout=120000
org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000

# 禁用Gradle构建脚本在线更新检查
systemProp.gradle.check.updates=false

# Mod信息
mod_id=authmod
mod_name=Auth Mod
mod_version=1.0.0
mod_group_id=com.authmod
mod_authors=dQryyx
mod_description=Simple authentication system
mod_license=MIT

# Minecraft版本
minecraft_version=1.20.1

# Forge版本
forge_version=47.4.0
forge_version_range=[47.4.0,)
loader_version_range=[47,)

# 映射版本
mapping_channel=official
mapping_version=1.20.1
minecraft_version_range=[1.20.1,1.21)